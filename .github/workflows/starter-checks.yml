name: Infrastructure and software checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/workflow.py check
      - name: Test assembler and Python reference model (not RTL)
        run: python scripts/workflow.py test-model
      - name: Run timed-pulse software demo
        run: python scripts/workflow.py demo
