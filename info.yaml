# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator"
  author:       "Davis Lester"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "SPI-loaded pin engine for timed pulses and UART transmission or reception."
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     20000000 # Initial design target; timing closure is not yet verified

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_davis_lester_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "protocol_emulator.v"
    - "protocol_spi.v"
    - "protocol_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
# The UART example drives TX on P1. Other protocol assignments are planned.
# See docs/ARCHITECTURE.md and docs/info.md before connecting hardware.
pinout:
  # Inputs
  ui[0]: "HOST_SCK"
  ui[1]: "HOST_MOSI"
  ui[2]: "HOST_CS_N"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "HOST_MISO"
  uo[1]: "RUNNING"
  uo[2]: "FAULT"
  uo[3]: "RX_VALID"
  uo[4]: "TX_READY"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "P0 / SPI_CS_N"
  uio[1]: "P1 / SPI_MOSI / UART_TX"
  uio[2]: "P2 / SPI_MISO / UART_RX / I2C_SCL"
  uio[3]: "P3 / SPI_SCK / I2C_SDA"
  uio[4]: "P4 / GPIO"
  uio[5]: "P5 / GPIO"
  uio[6]: "P6 / GPIO"
  uio[7]: "P7 / GPIO"

# Do not change!
yaml_version: 6
